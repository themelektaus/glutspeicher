<!DOCTYPE html><html><head><meta charset="utf-8"><title>Change password</title><script src="show.js"></script></head><body>
<form onsubmit="event.preventDefault(); show(this)">
  <input name="user" type="text" autocomplete="username">
  <input name="new" type="password" autocomplete="new-password">
  <input name="current" type="password" autocomplete="current-password">
  <input name="confirm" type="password" autocomplete="new-password">
  <button>Save</button>
</form><pre id="out"></pre></body></html>
