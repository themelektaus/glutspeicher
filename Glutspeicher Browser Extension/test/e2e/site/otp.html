<!DOCTYPE html><html><head><meta charset="utf-8"><title>Login with code</title><script src="show.js"></script></head><body>
<input name="q" type="search" placeholder="Search site">
<form id="f1" onsubmit="event.preventDefault(); document.querySelector('#step2').hidden=false; this.hidden=true; window.step1={user: this.user.value, pass: this.pass.value}">
  <input name="user" type="text" autocomplete="username">
  <input name="pass" type="password" autocomplete="current-password">
  <button>Next</button>
</form>
<form id="step2" hidden onsubmit="event.preventDefault(); show(this, window.step1)">
  <label>Code from your app <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code"></label>
  <button>Verify</button>
</form>
<pre id="out"></pre>
</body></html>
