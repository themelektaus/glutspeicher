services:
  app:
    image: melektaus/glutspeicher
    ports:
      - 8100:80
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/Data
    environment:
      - "GLUTSPEICHER_CRYPTO_KEY=${GLUTSPEICHER_CRYPTO_KEY:?set GLUTSPEICHER_CRYPTO_KEY (32 characters) in .env, see .env.example}"
